  /* 4 x 4 -ruudukko, laatat neliöitä */
  .grid {

  .tile {
    position:relative; min-width:0; min-height:0; border-radius:clamp(14px,4.5vw,22px); cursor:pointer; overflow:hidden;
    background:rgba(15,25,38,.72); border:1px solid rgba(255,255,255,.14);
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);

    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8%;
    transition: transform .12s ease, border-color .2s, box-shadow .2s;
    animation: pop .25s ease backwards;
  }
  @keyframes pop { from{ transform:scale(.8); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .tile:active { transform:scale(.94); }
  .tile.selected { border-color:rgba(120,200,255,.8); box-shadow:0 0 0 2px rgba(120,200,255,.35), 0 6px 22px rgba(80,170,255,.25); }
  .tile .icon svg { width:clamp(22px,7vw,40px); height:clamp(22px,7vw,40px); stroke-width:1.4; }
  .tile .label {
    font-size:clamp(9px,2.8vw,14px); font-weight:600; letter-spacing:.2px; text-align:center;
    padding:0 3px; line-height:1.12; text-shadow:0 1px 4px rgba(0,0,0,.5);
    max-width:100%;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    /* tavutus pitkille sanoille */
    hyphens:auto; -webkit-hyphens:auto; -moz-hyphens:auto; overflow-wrap:break-word;
  }
  .tile.add-tile { border-style:dashed; border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.06); }

  .del {
    position:absolute; top:5px; right:5px; width:20px; height:20px; border-radius:50%; z-index:2;
    background:rgba(255,70,70,.92); border:none; color:#fff; font-size:11px; font-weight:700;
    display:none; align-items:center; justify-content:center; cursor:pointer; line-height:1;
  }
  body.editing .del { display:flex; }
  body.editing .tile { animation: wiggle 0.35s ease infinite alternate; animation-delay:inherit; }
  @keyframes wiggle { from{ transform:rotate(-.8deg);} to{ transform:rotate(.8deg);} }

  .reader, .art {

  .full-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;

  .sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:10; max-width:560px; margin:0 auto;
    background:rgba(18,28,42,.97); border:1px solid rgba(255,255,255,.15); border-bottom:none;

    backdrop-filter: blur(14px);
  }
  .sheet.open { transform:translateY(0); }
  .sheet h2 { font-size:19px; margin-bottom:14px; }
  .sheet input {

  .icon-pick {

  .btn {

  .toast {
    position:fixed; left:50%; bottom:60px; transform:translateX(-50%) translateY(20px); z-index:30;
    background:rgba(0,0,0,.75); padding:10px 18px; border-radius:20px; font-size:14px;
    opacity:0; pointer-events:none; transition:all .25s; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>

      title:'OpenAI laajensi GPT-6-perhettä: Sol ja Luna',
      src:'openai.com', date:'22.9.2026',
      s5:'OpenAI päivitti GPT-6 Astran tuotesivun 22.9.2026 ja kertoi laajentavansa GPT-6-malliperhettä kahdella uudella mallilla: GPT-6 Sol ja GPT-6 Luna. Molemmat ovat Astran sisarmalleja samasta malliperheestä. Tarkoituksena on tarjota kevyempiä ja edullisempia vaihtoehtoja tehtäviin, joissa Astran täysi suorituskyky ei ole tarpeen. Käytännössä rutiinitehtäviin voi valita halvemman mallin ja säästää Astran vaativimpiin töihin. Nyt on hyvä hetki vertailla kolmen mallin toimintaa omissa CAD-kokeiluissa.',
      s30:'OpenAI kertoi 22. syyskuuta 2026 laajentavansa GPT-6-malliperhettä kahdella uudella mallilla, GPT-6 Solilla ja GPT-6 Lunalla. Kyseessä ovat Astran sisarmallit, jotka perustuvat samaan arkkitehtuuriin ja koulutusprosessiin. Uusien mallien tehtävä on kattaa kevyemmät käyttötapaat, joissa ei tarvita Astran huippuluokan päättelykykyä. Tämä jakaa GPT-6-perheen selkeästi kahteen kerrokseen: vaativat monivaiheiset tehtävät Astralle ja nopeat rutiinitehtävät Solille tai Lunalle. Käyttäjän kannalta merkittävin vaikutus on kustannusten hallinta, koska rutiinitehtävien ajaminen halvemmalla mallilla säästää budjettia vaativiin töihin. Tarkka hinnoittelu kannattaa tarkistaa OpenAI:n omasta hinnastosta, koska julkaisun yhteydessä sitä ei välttämättä vielä kerrottu kaikilta osin. Sovelluskehittäjille ja tehosteiden käyttäjille suositeltu käytäntö on testata sama tehtävä kaikilla kolmella mallilla ja mitata hinta, nopeus ja virhemäärä. CAD-käytössä esimerkiksi makron kirjoitus tai piirustusten tarkistus voi hyvin onnistua kevyemmällä mallilla, kun taas kokoonpanon suunnittelu vaatii Astran. Mallien valikoima myös ennustaa sitä, että tekoälyn käyttökustannukset laskevat kilpailun myötä. On syytä seurata, tuodaanko Sol ja Luna myös rajapintaan samoilla ominaisuuksilla kuin ChatGPT-käyttöliittymään. Vertailussa kannattaa kiinnittää huomiota konteksti-ikkunan kokoon ja tulostoksen enimmäispituuteen, jotka voivat erota mallien välillä. Kokonaisuutena laajennus on hyvä uutinen kaikille, jotka käyttävät tekoälyä suunnittelutyössä säännöllisesti.' },
    { tag:'UUTINEN', long:true, url:'https://openai.com',
      title:'Dots: aina päällä olevat agentit ChatGPT:ssa',
      src:'openai.com', date:'29.9.2026',
      s5:'OpenAI julkaisi 29.9. "dots"-ominaisuuden: aina päällä olevia agentteja ChatGPT:ssa, jotka pyörivät GPT-6 Astralla. Jokaisella dotilla on oma pilvitietokone ja selain, ja ne voivat yhdistyä yli 4 000 sovellukseen. Saatavuus alkaa ChatGPT Pro -tilaajille ja Business Premium -paikoille; Enterprise-asiakkaat saavat betaversion. Dots voi hoitaa esimerkiksi jatkuvaa uutisseurantaa ilman erillistä backendiä. Se on samalla kilpailija ja kumppani sille seuranta-appi-idealle, jota ollaan rakentamassa.',
      s30:'OpenAI julkaisi 29. syyskuuta 2026 uuden "dots"-ominaisuuden, joka tuo ChatGPT:hin aina päällä olevia tekoälyagentteja. Agentit käyttävät GPT-6 Astra -mallia ja jokaisella niistä on oma pilvitietokone sekä oma selain. Tämä tarkoittaa sitä, että agentti voi itsenäisesti käydä verkkosivuilla, täyttää lomakkeita ja käsitellä tiedostoja ilman että käyttäjä on paikalla. OpenAI kertoo agenttien yhdistyvän yli neljään tuhanteen sovellukseen ja verkkopalveluun. Käyttötarkoituksiksi mainitaan muun muassa säännöllinen tiedonkeruu, kalenterien hallinta ja projektien seuranta. Saatavuus alkaa ChatGPT Pro -tilaajille sekä Business-tilien Premium-paikoille, ja Enterprise-asiakkaat pääsevat mukaan betaversiona. Hinnoittelun yksityiskohdat kannattaa tarkistaa OpenAI:n sivuilta, koska jatkuva toiminta kuluttaa todennäköisesti laskentakrediittejä. Sinun kannaltasi dots on mielenkiintoinen kahdella tavalla. Toisaalta se voi korvata osan siitä backend-työstä, jonka ollaan suunnittelemassa uutisseurantaan. Toisaalta se ei korvaa omia kustomoituja näkymiä, kuten juuri rakennettua kiinnostusruudukkoa ja lukunäkymää. Mahdollinen hybridimalli olisi, että dots hoitaa tiedonhaun ja oma appi esittämisen ja hallinnan. Kannattaa myös muistaa, että agenttien antamat vastaukset kannattaa edelleen tarkistaa, koska aina päällä oleva toiminta voi tuottaa virheitä huomaamatta. Tietosuojan kannalta on hyvä miettiä, mitä tunnisteita dotille annetaan käyttöoikeuksia. Kokonaisuutena julkaisu on merkittävä askel kohti sitä, että tekoäly tekee työn sijasta myös sen jatkuvan seurannan.' },
    { tag:'DEMO', long:false, url:'https://www.youtube.com',

      src:'youtube.com', date:'9.2026',

      s30:'MecAgent-harnessin kehittäjät julkaisivat uuden videon, jossa GPT-6 Astra generoi robot arm -kokoonpanon SolidWorks 2026 -ohjelmassa. Videon mukaan koko kokoonpano syntyi yhdestä luonnollisen kielen promptista. Lopputuloksessa on 11 erillistä osaa ja yksi pääkokoonpano. Tämä on jatkoa aiemmille demoille, joissa samalla menetelmällä rakennettiin muun muassa 41-osainen turbojet-moottori. Demo kertoo, että harnessin kypsyys on edennyt yksittäisistä osista kohti mielekkäitä kokonaisuuksia. Pienempi osamäärä tekee tuloksen myös helpommaksi tarkistaa ja mitata. Videon perusteella työnkulku näyttää edelleen vaativan ohjelmallisen välikerroksen, joka kääntää mallin komennoiksi. On myös syytä muistaa, että demo videolla ei kerro vielä mitään toleransseista, materiaalivalinnoista tai valmistettavuudesta. Näissä demossa syntyneet mallit ovat siis lähtökohtia, ei valmiita suunnitelmia. Sinun kannattaisi kokeilla samaa harnessia omalla tutulla kokoonpanolla ja verrata syntynyttä mallia omaan käsityöhösi. Näin näet suoraan, mihin työkalu jo yltää ja missä se vielä kompastuu.' },
    { tag:'OPAS', long:true, url:'https://www.getleo.ai',
      title:'Leo AI: "AI for Mechanical Engineers" -opas',
      src:'getleo.ai', date:'25.9.2026',
      s5:'Leo AI julkaisi 25.9. kattavan oppaan tekoälyn käytöstä konetekniikassa. Opas on poikkeuksellisen rehellinen työkalujen rajoituksista. Keskeisin käytännön havainto koskee Ansys AI+: FEA-työnkulun generointi lyhenee tyypillisestä 4–6 tunnista alle tuntiin. Ratkaisevat parametrit vaativat kuitenkin edelleen kokeneen insinöörin arvion. Opas sopii lukulistalle ennen omia työkaluvalintoja.',
      s30:'Leo AI julkaisi syyskuun lopussa laajan oppaan, jonka otsikko on "AI for Mechanical Engineers". Opas käy läpi tekoälyn käyttömahdollisuudet konetekniikan eri osa-alueilla. Sen lähestymistapa on poikkeuksellisen tasapainoinen, koska se esittelee mahdollisuudet ja rajoitukset rinnakkain. Yksi oppaan keskeisimmistä esimerkeistä koskee Ansys AI+ -ohjelmistoa. Sen avulla elementtianalyysin eli FEA:n työnkulku voi lyhentyä tyypillisestä neljästä kuudesta tunnista alle tuntiin. Ohjelma generoi alkuverkon ja ehdottaa reunaehtoja automaattisesti. Tämä vapauttaa insinöörin aikaa itse laskennan sijaan asetusten tarkistukseen ja tulosten tulkintaan. Opas korostaa kuitenkin, että automatiikka ei poista asiantuntijuutta. Ratkaisevat mallinnuspäätökset, kuten materiaalimallit ja kuormitukset, vaativat edelleen kokeneen insinöörin arvion. Ilman sitä laskennan nopeus voi johtaa nopeasti virheellisiin tuloksiin. Opas käsittelee myös suunnittelun automatisointia ja dokumentaation generointia tekoälyllä. Lisäksi siinä arvioidaan useita markkinoilla olevia työkaluja, mukaan lukien Leo AI:n omia ominaisuuksia. Lukijalle jää selkeä kuva siitä, missä tekoäly jo säästää aikaa ja missä se on vielä kokeiluvaiheessa. Oppaan lopussa annetaan käytännön vinkkejä työkalujen kokeiluun omassa organisaatiossa. Kannattaa aloittaa pienellä, mitattavalla tehtävällä ja vertailla tulosta manuaaliseen työhön. Kokonaisuutena opas on erinomainen lähtökohta kaikille, jotka suunnittelevat tekoälyn käyttöönottoa konetekniikan työkalupakkiin.' },

const LS = 'kiinnostukset-v1';
let items = JSON.parse(localStorage.getItem(LS) || 'null') || DEFAULTS;
let editMode = false, pickedIcon = ICONS[0];

const grid = document.getElementById('grid'), sheet = document.getElementById('sheet'), toast = document.getElementById('toast');
const reader = document.getElementById('reader'), readerList = document.getElementById('readerList'), readerTitle = document.getElementById('readerTitle');
const art = document.getElementById('art'), artBody = document.getElementById('artBody');

function save(){ localStorage.setItem(LS, JSON.stringify(items)); }
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); }
function openSheet(){ pickedIcon = ICONS[0]; buildPicker(); document.getElementById('nameInput').value=''; sheet.classList.add('open'); setTimeout(()=>document.getElementById('nameInput').focus(),300); }

function render(){
  grid.innerHTML = '';
  items.forEach((it,idx)=>{
    const t = document.createElement('div');
    t.className = 'tile' + (it.sel ? ' selected' : '');
    t.style.animationDelay = (idx*0.03)+'s';
    t.innerHTML = `<button class="del">✕</button>
                   <div class="icon"><i data-lucide="${it.icon}"></i></div>
                   <div class="label">${it.name}</div>`;
    t.querySelector('.del').onclick = e => { e.stopPropagation(); items = items.filter(x=>x.id!==it.id); save(); render(); showToast('Poistettu: '+it.name); };
    t.onclick = () => { if(editMode) return; openReader(it); };
    grid.appendChild(t);
  });
  const a = document.createElement('div');
  a.className = 'tile add-tile';
  a.style.animationDelay = (items.length*0.03)+'s';
  a.innerHTML = `<div class="icon"><i data-lucide="plus"></i></div><div class="label">Lisää aihe</div>`;
  a.onclick = () => { if(!editMode) openSheet(); };
  grid.appendChild(a);
  lucide.createIcons();
}

function openReader(it){
  readerTitle.innerHTML = it.name + '<span class="sub">Viimeiset 30 päivää</span>';
  const news = SAMPLE_NEWS[it.id];
  if(!news){
    readerList.innerHTML = '<div class="reader-empty">Ei vielä sisältöä tälle aiheelle.<br>Seuranta käynnistyy maanantaina.</div>';
  } else {
    readerList.innerHTML = news.map((n,i) =>
      `<div class="news" data-i="${i}">
        <span class="n-tag">${n.tag}</span>${n.long ? ' <span class="n-tag long">PITKÄ</span>' : ''}
        <div class="n-title">${n.title}</div>
        <div class="n-sum">${n.s5}</div>
        <div class="n-meta">${n.src} · ${n.date}</div>
      </div>`).join('');
    readerList.querySelectorAll('.news').forEach(el => {
      el.onclick = () => openArticle(news[+el.dataset.i]);
    });
  }
  lucide.createIcons();
  reader.classList.add('open');
}

/* Artikkelinäkymä: 1) tiivistelmä ~5 lausetta, 2) ~30 lausetta TAI koko artikkeli
   suomeksi jos alle 30 lausetta, 3) linkki alkuperäiseen */
function openArticle(n){
  const box2title = n.long ? 'Laajempi tiivistelmä · n. 30 lausetta' : 'Koko artikkeli suomeksi · alle 30 lausetta';
  let html = `<h3>${n.title}</h3><div class="a-meta">${n.src} · ${n.date}</div>
    <div class="sum-box"><div class="sb-title"><i data-lucide="align-left"></i> Tiivistelmä · n. 5 lausetta</div><p>${n.s5}</p></div>
    <div class="sum-box gold"><div class="sb-title"><i data-lucide="file-text"></i> ${box2title}</div><p>${n.s30}</p></div>`;
  if(n.url){
    html += `<a class="full-btn" href="${n.url}" target="_blank" rel="noopener">Alkuperäinen artikkeli <i data-lucide="external-link"></i></a>`;
  } else {
    html += `<div class="reader-empty" style="margin-top:20px;">Alkuperäistä linkkiä ei vielä saatavilla prototyypissä.</div>`;
  }
  artBody.innerHTML = html;
  lucide.createIcons();
  art.classList.add('open');
}
document.getElementById('backBtn').onclick = () => reader.classList.remove('open');
document.getElementById('artBackBtn').onclick = () => art.classList.remove('open');

function buildPicker(){
  const p = document.getElementById('iconPicker'); p.innerHTML = '';
  ICONS.forEach(ic=>{
    const b = document.createElement('div');
    b.className = 'icon-pick' + (ic===pickedIcon?' sel':'');
    b.innerHTML = `<i data-lucide="${ic}"></i>`;
    b.onclick = ()=>{ pickedIcon = ic; buildPicker(); };
    p.appendChild(b);
  });
  lucide.createIcons();
}
document.getElementById('saveBtn').onclick = () => {
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ showToast('Anna nimi'); return; }
  items.push({ id: Date.now().toString(), name, icon: pickedIcon, sel:false });
  save(); render(); sheet.classList.remove('open');
  showToast('Lisätty: ' + name);
};
document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('saveBtn').click(); });

document.getElementById('editBtn').onclick = () => {
  editMode = !editMode;
  document.body.classList.toggle('editing', editMode);
  showToast(editMode ? 'Poistotila päällä – napauta ✕' : 'Valmis');
};
sheet.addEventListener('click', e => { if(e.target===sheet) sheet.classList.remove('open'); });

render();
</script>
</body>
</html>
